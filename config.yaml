# Central settings for the resume matcher.
# Loaded by src/config.py at import time — change values here instead of
# editing Python. Anything omitted falls back to the defaults in src/config.py.

embedding:
  # Model that converts text into number vectors for matching.
  # MiniLM is fast, accurate enough for a single-pair comparison, and cheap.
  model: sentence-transformers/all-MiniLM-L6-v2
  # Vector length the model outputs — used for the empty-text fallback.
  dimensions: 384

  # Used instead whenever either document contains Arabic script.
  #
  # This is not a benchmark-driven choice: all-MiniLM-L6-v2 is an
  # English-only model and has no Arabic in its training data, so it cannot
  # represent an Arabic requirement at all. The routing is justified by
  # construction. The bilingual eval set only quantifies the size of the gap
  # (F1 0.40 -> 0.62) rather than deciding the question, which keeps that set
  # from having informed a design decision.
  #
  # The cost is real and worth seeing: ~480MB on disk against ~90MB, and a
  # 128-token window against 256, so the chunker halves its stride. Loading
  # both at once will not fit a 1GB free tier, which is why this is a route
  # rather than a replacement — an all-English document never pays for it.
  multilingual_model: sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2

# Cosine-similarity bands, shared by Comparator and Generator so the two can
# never disagree about the same score.
scoring:
  strong: 0.85
  good: 0.70
  partial: 0.55

# Requirement-level matching. These apply only to requirements too general to
# check literally ("strong engineering skills"); anything naming a technology
# or a degree is decided by presence, not similarity.
#
# CALIBRATED, not guessed. `python -m eval.run_eval` measures these against 124
# labelled requirement/bullet pairs in data/eval/pairs.jsonl. The original 0.55
# was chosen by eyeballing one posting and was badly wrong — it scored precision
# 1.00 at recall 0.20, i.e. it missed four out of five genuine matches.
#
# Bi-encoder cosine, with the literal gate applied:
#
#   threshold   precision  recall
#     0.55         1.00      0.39   <- original guess
#     0.40         0.95      0.72
#     0.36         0.95      0.75   <- covered
#     0.28         0.87      0.80   <- partial
#     0.24         0.76      0.83      precision falls away below here
#
# Precision is weighted over recall on purpose: a false "covered" tells someone
# they meet a requirement they do not, which is the failure this project exists
# to prevent. Re-run the eval after changing anything here.
matching:
  covered: 0.36
  partial: 0.28

  # Optional cross-encoder reranking. Set model to an empty string to disable
  # and fall back to bi-encoder cosine (also happens automatically if the model
  # cannot be loaded — e.g. a deployment without the memory for a second
  # transformer).
  #
  # 5-fold cross-validated, both with the literal gate:
  #     bi-encoder      P 0.90  R 0.53
  #     cross-encoder   P 0.92  R 0.65     <- same precision, +12 points recall
  #
  # Thresholds are raw logits, not probabilities, and the curve here is STEEP:
  # -10.70 gives precision 0.94, but -11.48 gives 0.50. Do not nudge these
  # without re-running the eval.
  reranker:
    model: cross-encoder/ms-marco-MiniLM-L-6-v2
    covered: -10.70
    partial: -11.20

cleaning:
  # Added on top of NLTK's English stopword list. These are resume boilerplate:
  # every resume contains them, so they carry no signal about a match.
  stopwords_extra:
    - resume
    - curriculum
    - vitae
    - experience
    - skill
    - responsible
    - work
    - developed
    - project
    - reference
    - available
    - request

skills:
  # Vocabulary used to pull a concrete skill set out of each document.
  path: data/skills_list.txt

# Model IDs for the optional LLM analysis step. Providers retire model names
# without warning — "gemini-1.5-flash" was hardcoded here and had been removed,
# which broke the whole AI panel. Keeping them here makes that a one-line fix.
#
# Note on gemini: the "-latest" alias is deliberate. Pinned Gemini versions get
# closed to new users over time — gemini-1.5-flash and gemini-2.5-flash both
# return 404 on this key, and gemini-2.0-flash returns 429 with a free-tier
# quota of 0. Listing the models does not tell you which ones you may call.
llm:
  gemini: gemini-flash-latest
  openai: gpt-4o-mini
  anthropic: claude-3-5-haiku-20241022
