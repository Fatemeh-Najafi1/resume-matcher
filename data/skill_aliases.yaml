# ── Arabic terminology ───────────────────────────────────────────────────────
#
# Postings in the Gulf are frequently written in Arabic while technical resumes
# are usually written in English, so a requirement and the evidence for it
# routinely sit in different scripts. The multilingual encoder handles the
# fuzzy half of that; these entries handle the literal half, which is the half
# that produces auditable reasons.
#
# Written in plain orthography — normalise() folds alef/yeh/teh-marbuta
# variants, strips tatweel and maps Arabic-Indic digits, so "الإصطناعي" and
# "الاصطناعي" both reach the same key.
#
# One-way, like everything else here: an Arabic requirement is evidenced by
# the English term on a resume. The reverse is deliberately NOT asserted.

برمجة: [programming, software development, python, java, javascript, c++]
تطوير البرمجيات: [software development, software engineering, programming]
تحليل البيانات: [data analysis, data analytics, analytics, pandas, sql]
هندسة البيانات: [data engineering, etl, airflow, spark, pipelines]
تعلم الآلة: [machine learning, ml, scikit-learn, tensorflow, pytorch, xgboost]
