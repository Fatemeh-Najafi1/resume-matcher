# Evidence map: which concrete terms count as evidence for a broader concept.
#
# The literal gate searches for the requirement's exact words. That made it
# reject "work on natural language processing problems" against a bullet
# reading "Built NLP tools..." — the letters did not match, so it vetoed.
#
# Each key is a concept a job posting might ask for. Each value lists terms
# that, if present in the resume, count as evidence for it. Relationships are
# one-way on purpose: Git evidences version control, but a posting asking for
# Git is NOT satisfied by a resume that only says "version control".
#
# These only ever ADD matches, so recall can rise and precision cannot fall.
#
# NOTE: this is used by requirement matching only. The keyword gap report stays
# strictly literal — if your resume never types "machine learning", that is
# still worth telling you, because ATS keyword filters are literal too.

version control: [git, github, gitlab, bitbucket, svn, mercurial]

